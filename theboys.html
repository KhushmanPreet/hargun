<!DOCTYPE html>
<html>
<head>
  <title>GALLERY - HARGUN KAMBO</title>
  <link rel="stylesheet" type="text/css" href="css/indexstyle.css">
  <link rel="stylesheet" href="css/gallery.css">
  <script src="script.js" defer></script>
  <script src="https://kit.fontawesome.com/c979112d4e.js" crossorigin="anonymous"></script>
</head>
<body>

  <header>
    <div id="name" class="name"><a href="index.html">HARGUN KAMBO</a></div>
    <nav>
      <ul>
        <li><a href="work.html">WORK</a></li>
        <li><a href="journal.html">JOURNAL</a></li>
        <li><a href="about.html">INFO</a></li>
      </ul>
    </nav>
  </header>

  <!-- THE CROSS BUTTON TO GO BACK -->
  <a href="work.html" class="close-gallery">
    <i class="fa-solid fa-xmark"></i>
  </a>

  <main class="gallery-container">
    
    <div class="gallery">
      <!-- GLOBAL NAVIGATION BUTTONS (Only need 2!) -->
      <button class="nav-prev"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="nav-next"><i class="fa-solid fa-chevron-right"></i></button>

      <!-- THE IMAGES -->
      <div class="gallery-item active"><img src="allProject/New folder/portraits/boys 12/1.jpg" alt="Image 1"></div>
      <div class="gallery-item"><img src="allProject/New folder/portraits/boys 12/2.jpg" alt="Image 2"></div>
      <div class="gallery-item"><img src="allProject/New folder/portraits/boys 12/3.jpg" alt="Image 3"></div>
    </div>
    
    <!-- THE NEW 5-ITEM THUMBNAIL SLIDER -->
    <div class="thumbnail-window">
      <div class="thumbnail-track">
        <img class="thumbnail-item active" src="allProject/New folder/portraits/boys 12/1.jpg" alt="Thumb 1">
        <img class="thumbnail-item" src="allProject/New folder/portraits/boys 12/2.jpg" alt="Thumb 2">
        <img class="thumbnail-item" src="allProject/New folder/portraits/boys 12/3.jpg" alt="Thumb 3">
      </div>
    </div>

  </main>

  <!-- Premium Inversion Cursor -->
  <div class="custom-cursor"></div>

</body>
</html>
