<!DOCTYPE html>
<html>
<head>
  <title>Hargun Kambo - Journal</title>
  <link rel="stylesheet" type="text/css" href="css/indexstyle.css">
  <link rel="stylesheet" href="css/journal.css">
</head>
<body>
  
  <header>
    <div id="name" class="name">HARGUN KAMBO</div>
    <nav>
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="work.html">WORK</a></li>
        <li><a href="journal.html">JOURNAL</a></li>
        <li><a href="about.html">ABOUT</a></li>
      </ul>
    </nav>
  </header>

  <main class="journal-wrapper">

    <section id="start-screen" onclick="startJournal()">
      <div class="title-large">THE JOURNAL</div>
      <div class="subtitle">CLICK TO OPEN</div>
    </section>
    
    <div id="fullscreen-menu">
      <div class="menu-content">
        <div class="menu-header">TABLE OF CONTENTS</div>
        <ul id="menu-list">
          </ul>
        <div class="close-menu" onclick="toggleMenu()">CLOSE INDEX</div>
      </div>
    </div>

    <div id="bookmark-container">
      <div class="ribbon-bookmark">
        <span id="active-bookmark-text">SELECT CHAPTER</span>
      </div>
    </div>

    <section class="photo-background" id="album-stage">
      </section>

    <div class="nav-overlay-forward" id="nav-forward"></div> 

  </main>

  <script src="script.js"></script>
</body>
</html>
