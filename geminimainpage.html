<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hargun | Visuals</title>
    <style>
        /* Base Reset & Darkroom Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Prevent text highlighting when clicking fast */
        }

        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace; /* Typewriter font for rawness */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. The Analog Grain Overlay */
        /* Uses an inline SVG to generate static TV-like noise */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Crucial: lets you click through it */
            z-index: 50;
            opacity: 0.08; /* Keep it subtle */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* 2. The Darkroom Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 40;
            box-shadow: inset 0 0 250px rgba(0,0,0,0.95);
        }

        /* 3. The Light Leak Flash */
        .light-leak {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 45;
            background: radial-gradient(circle at 70% 30%, rgba(255, 140, 0, 0.8) 0%, rgba(255, 50, 0, 0.4) 30%, transparent 70%);
            mix-blend-mode: screen;
            opacity: 0; /* Hidden by default */
        }

        /* The animation triggered by JS */
        .flash-anim {
            animation: projectorFlash 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @keyframes projectorFlash {
            0% { opacity: 0; transform: scale(1) translateX(5%); }
            10% { opacity: 1; transform: scale(1.05) translateX(0); }
            100% { opacity: 0; transform: scale(1) translateX(-5%); }
        }

        /* 4. The Slide Container */
        .projector-screen {
            position: relative;
            width: 80vw;
            max-width: 900px;
            aspect-ratio: 3 / 2; /* Classic 35mm slide ratio */
            background: #111;
            border: 20px solid #0a0a0a; /* Thick plastic slide border */
            border-radius: 5px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* 5. The Individual Slides */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Hidden by default */
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: rgba(255,255,255,0.5);
            /* Raw image filters */
            filter: contrast(1.1) sepia(0.2); 
        }

        /* Active state for slide (No transitions, just snaps) */
        .slide.active {
            display: flex;
        }

        /* Clickable Zones */
        .click-zone {
            position: fixed;
            top: 0;
            height: 100vh;
            width: 50vw;
            z-index: 20;
            cursor: pointer;
        }
        .click-zone.left { left: 0; }
        .click-zone.right { right: 0; }

        /* Meta Information */
        .info-panel {
            position: fixed;
            bottom: 30px;
            left: 40px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .brand {
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .slide-title {
            color: #888;
            font-size: 0.9rem;
        }

        .counter {
            position: fixed;
            bottom: 30px;
            right: 40px;
            z-index: 30;
            color: #555;
            font-size: 0.9rem;
        }

    </style>
</head>
<body>

    <div class="grain-overlay"></div>
    <div class="vignette"></div>
    <div id="leak" class="light-leak"></div>

    <div class="click-zone left" id="btn-prev" title="Previous Slide"></div>
    <div class="click-zone right" id="btn-next" title="Next Slide"></div>

    <div class="projector-screen">
        
        <div class="slide active" data-title="Urban Portraits" style="background: linear-gradient(135deg, #3a3224 0%, #1c1913 100%);">
            Placeholder: Photo
        </div>

        <div class="slide" data-title="Cinematic Reel 2026" style="background: linear-gradient(to bottom, #111, #222); flex-direction: column; gap: 10px;">
            <div style="width: 0; height: 0; border-top: 15px solid transparent; border-left: 25px solid #888; border-bottom: 15px solid transparent;"></div>
            <span style="font-size: 1rem;">Placeholder: Video Loop</span>
        </div>

        <div class="slide" data-title="Commercial Studio" style="background: radial-gradient(circle, #555 0%, #111 100%);">
            Placeholder: Photo
        </div>

        <div class="slide" data-title="Raw Landscapes" style="background: linear-gradient(45deg, #1b261b 0%, #0d120d 100%);">
            Placeholder: Photo
        </div>

    </div>

    <div class="info-panel">
        <div class="brand">Hargun Kambo</div>
        <div class="slide-title" id="title-display">Urban Portraits</div>
    </div>
    
    <div class="counter">
        <span id="current-count">1</span> / <span id="total-count">4</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slides = document.querySelectorAll('.slide');
            const leak = document.getElementById('leak');
            const titleDisplay = document.getElementById('title-display');
            const currentCountDisplay = document.getElementById('current-count');
            
            let currentIndex = 0;
            let isAnimating = false;

            document.getElementById('total-count').textContent = slides.length;

            function triggerSlideChange(newIndex) {
                if (isAnimating) return; // Prevent spam-clicking breaking the animation
                isAnimating = true;

                // 1. Trigger the light leak flash
                leak.classList.remove('flash-anim');
                // Trigger reflow to restart animation
                void leak.offsetWidth; 
                leak.classList.add('flash-anim');

                // 2. Snap the slides halfway through the flash (150ms delay)
                setTimeout(() => {
                    // Remove active class from old
                    slides[currentIndex].classList.remove('active');
                    
                    // Update Index
                    currentIndex = newIndex;
                    
                    // Add active class to new
                    slides[currentIndex].classList.add('active');
                    
                    // Update Text UI
                    titleDisplay.textContent = slides[currentIndex].dataset.title;
                    currentCountDisplay.textContent = currentIndex + 1;
                }, 150); 

                // 3. Unlock interaction after flash finishes
                setTimeout(() => {
                    isAnimating = false;
                }, 350); 
            }

            document.getElementById('btn-next').addEventListener('click', () => {
                let nextIndex = (currentIndex + 1) % slides.length; // Loops back to start
                triggerSlideChange(nextIndex);
            });

            document.getElementById('btn-prev').addEventListener('click', () => {
                let prevIndex = (currentIndex - 1 + slides.length) % slides.length; // Loops to end
                triggerSlideChange(prevIndex);
            });

            // Bonus: Allow keyboard navigation (Left/Right arrows)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    document.getElementById('btn-next').click();
                } else if (e.key === 'ArrowLeft') {
                    document.getElementById('btn-prev').click();
                }
            });
        });
    </script>
</body>
</html>
